[package]
name = "office-convert-lambda"
version = "0.1.1"
edition = "2024"
repository = "https://github.com/jacobtread/office-convert-lambda"
authors = ["Jacobtread <jacobtread@gmail.com>"]
readme = "./README.md"
description = "Lambda for converting office files using LibreOffice"

[workspace]
members = [".", "./client"]

[dependencies]
# Lambda core
lambda_runtime = "=1.1.3"

# Async runtime
tokio = { version = "=1.52.1", features = ["macros"] }

# Environment variables
dotenvy = "=0.15.7"

# JSON serialization
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

# Error handling
thiserror = "=2.0.18"
aws-config = "=1.8.16"
aws-sdk-s3 = "=1.131.0"

# Basic logging
tracing = "=0.1.44"

# UUID for unique file IDs
uuid = { version = "=1.23.1", features = ["v4"] }

# Core libreoffice library
libreofficekit = { version = "=0.5" }
